<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Pepperstone</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- Header -->
    <header class="bg-white shadow-sm">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center">
                <a href="index.html" class="text-2xl font-bold text-blue-600">
                    <img src="public/download.svg" alt="Pepperstone" class="h-8">
                </a>
            </div>
            
            <div class="hidden md:flex space-x-6">
                <a href="ways-to-trade.html" class="text-gray-700 hover:text-blue-600">Ways to trade</a>
                <a href="markets.html" class="text-gray-700 hover:text-blue-600">Markets</a>
                <a href="trading-platforms.html" class="text-gray-700 hover:text-blue-600">Trading platforms</a>
                <a href="market-analysis.html" class="text-gray-700 hover:text-blue-600">Market analysis</a>
                <a href="about-us.html" class="text-gray-700 hover:text-blue-600">About us</a>
            </div>
            
            <div class="flex items-center space-x-4">
                <div class="flex items-center text-gray-600">
                    <i class="fas fa-globe mr-2"></i>
                    <span class="text-sm font-medium">ENGLISH</span>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex items-center justify-center min-h-screen py-12 px-4">
        <div class="max-w-md w-full space-y-8">
            <!-- Login Form -->
            <div class="bg-white rounded-lg shadow-lg p-8">
                <div class="text-center mb-8">
                    <h1 class="text-3xl font-bold text-gray-900">Log into Pepperstone</h1>
                </div>
                
                <form class="space-y-6">
                    <!-- Email Field -->
                    <div>
                        <label for="email" class="block text-sm font-medium text-gray-700 mb-2">Email</label>
                        <input 
                            type="email" 
                            id="email" 
                            name="email" 
                            class="w-full px-3 py-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                            required
                        >
                    </div>
                    
                    <!-- Password Field -->
                    <div>
                        <label for="password" class="block text-sm font-medium text-gray-700 mb-2">Password</label>
                        <div class="relative">
                            <input 
                                type="password" 
                                id="password" 
                                name="password" 
                                class="w-full px-3 py-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent pr-10"
                                required
                            >
                            <button type="button" class="absolute inset-y-0 right-0 pr-3 flex items-center">
                                <i class="fas fa-eye-slash text-gray-400"></i>
                            </button>
                        </div>
                    </div>
                    
                    <!-- Forgotten Password Link -->
                    <div class="text-right">
                        <a href="#" class="text-blue-600 hover:text-blue-700 text-sm">Forgotten password?</a>
                    </div>
                    
                    <!-- Login Button -->
                    <button 
                        type="submit" 
                        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-md transition duration-200"
                    >
                        Login
                    </button>
                </form>
                
                <!-- Sign Up Link -->
                <div class="text-center mt-6">
                    <p class="text-gray-600">
                        Not yet a client? <a href="#" class="text-blue-600 hover:text-blue-700">Sign up here</a>
                    </p>
                </div>
                
                <!-- Divider -->
                <div class="text-center mt-8 mb-6">
                    <span class="text-gray-500">or</span>
                </div>
                
                <!-- Social Login Buttons -->
                <div class="space-y-3">
                    <!-- Apple Login -->
                    <button class="w-full flex items-center justify-center px-4 py-3 border border-gray-300 rounded-md hover:bg-gray-50 transition duration-200">
                        <i class="fab fa-apple text-xl mr-3"></i>
                        <span class="font-medium text-gray-700">Log in with Apple</span>
                    </button>
                    
                    <!-- Google Login -->
                    <button class="w-full flex items-center justify-center px-4 py-3 border border-gray-300 rounded-md hover:bg-gray-50 transition duration-200">
                        <i class="fab fa-google text-xl mr-3"></i>
                        <span class="font-medium text-gray-700">Log in with Google</span>
                    </button>
                    
                    <!-- Facebook Login -->
                    <button class="w-full flex items-center justify-center px-4 py-3 border border-gray-300 rounded-md hover:bg-gray-50 transition duration-200">
                        <i class="fab fa-facebook text-xl mr-3 text-blue-600"></i>
                        <span class="font-medium text-gray-700">Log in with Facebook</span>
                    </button>
                </div>
                
                <!-- Support Link -->
                <div class="text-center mt-8">
                    <p class="text-gray-600 text-sm">
                        Can't log in? Contact us at <a href="mailto:support@pepperstone.com" class="text-blue-600 hover:text-blue-700">support@pepperstone.com</a>
                    </p>
                </div>
            </div>
        </div>
    </main>

    <script>
        // Password visibility toggle
        document.querySelector('button[type="button"]').addEventListener('click', function() {
            const passwordInput = document.getElementById('password');
            const eyeIcon = this.querySelector('i');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.classList.remove('fa-eye-slash');
                eyeIcon.classList.add('fa-eye');
            } else {
                passwordInput.type = 'password';
                eyeIcon.classList.remove('fa-eye');
                eyeIcon.classList.add('fa-eye-slash');
            }
        });
    </script>
</body>
</html>
